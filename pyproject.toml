[project]
name = "bq-cost-guard"
version = "0.1.0"
description = "Estimate BigQuery query cost and lint FinOps anti-patterns before merge."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehdi Leqsiouer" }]
keywords = ["bigquery", "finops", "dbt", "sql", "cost", "ci"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
    "sqlglot>=25",
    "google-cloud-bigquery>=3.20",
]

[project.urls]
Homepage = "https://github.com/Mehdi-Leqsiouer/bq-cost-guard"
Issues = "https://github.com/Mehdi-Leqsiouer/bq-cost-guard/issues"

[project.scripts]
bq-cost-guard = "bq_cost_guard.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.12", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bq_cost_guard"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
